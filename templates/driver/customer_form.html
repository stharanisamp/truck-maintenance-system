{% extends 'base.html' %}
{% block title %}{{ action }} Customer{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-lg-8">
        <div class="glass-panel p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-3">
                <div class="p-3 rounded-circle bg-purple bg-opacity-10 text-purple">
                    <i class="fa-solid fa-building-user fs-3"></i>
                </div>
                <div>
                    <h3 class="fw-bold text-white mb-0">{{ action }} Customer Logistics Profile</h3>
                    <p class="text-muted small mb-0">Record factory dispatch and delivery client points</p>
                </div>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company / Business Name <span class="text-danger">*</span></label>
                        <input type="text" name="company_name" class="form-control" placeholder="e.g. Kongu Steel Traders" value="{{ customer.company_name if customer else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Contact Person</label>
                        <input type="text" name="contact_person" class="form-control" placeholder="e.g. P. Arumugam" value="{{ customer.contact_person if customer else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
                        <input type="tel" name="mobile_number" class="form-control" placeholder="+91 94422 12345" value="{{ customer.mobile_number if customer else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="client@company.com" value="{{ customer.email if customer else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">GST Identification Number (GSTIN)</label>
                        <input type="text" name="gst_number" class="form-control font-monospace" placeholder="33AABCK5678B1Z2" value="{{ customer.gst_number if customer else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Standard Loading Location</label>
                        <input type="text" name="loading_location" class="form-control" placeholder="e.g. Salem Steel Plant Gate #2" value="{{ customer.loading_location if customer else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Standard Unloading Location</label>
                        <input type="text" name="unloading_location" class="form-control" placeholder="e.g. Coimbatore SIDCO Yard" value="{{ customer.unloading_location if customer else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Registered Office Address</label>
                        <input type="text" name="address" class="form-control" placeholder="City, District, State" value="{{ customer.address if customer else '' }}">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary">
                    <a href="{{ url_for('driver.customers') }}" class="btn btn-outline-custom">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="fa-solid fa-check me-2"></i> Save Customer Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
