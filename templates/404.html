{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5 text-center">
    <div class="col-12 col-md-6">
        <div class="glass-panel p-5">
            <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>
            <h2 class="fw-bold text-white">404 - Destination Not Found</h2>
            <p class="text-muted">The requested fleet route or memo record does not exist or has been moved.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">
                <i class="fa-solid fa-house me-2"></i> Return to Fleet Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
