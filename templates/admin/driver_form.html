{% extends 'base.html' %}
{% block title %}{{ action }} Driver{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-lg-8">
        <div class="glass-panel p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4 border-bottom border-secondary pb-3">
                <div class="p-3 rounded-circle bg-info bg-opacity-10 text-info">
                    <i class="fa-solid fa-id-card fs-3"></i>
                </div>
                <div>
                    <h3 class="fw-bold text-white mb-0">{{ action }} Driver Profile</h3>
                    <p class="text-muted small mb-0">Record and manage commercial lorry driver credentials</p>
                </div>
            </div>

            <form method="POST">
                <div class="row g-3">
                    {% if action == 'Add' %}
                    <div class="col-md-6">
                        <label class="form-label">Driver Code</label>
                        <input type="text" name="driver_code" class="form-control font-monospace text-primary fw-bold" value="{{ next_code }}" readonly>
                    </div>
                    {% endif %}

                    <div class="col-md-6">
                        <label class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" value="{{ driver.full_name if driver else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" value="{{ driver.email if driver else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" value="{{ driver.phone if driver else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Driving License # <span class="text-danger">*</span></label>
                        <input type="text" name="license_number" class="form-control font-monospace" value="{{ driver.license_number if driver else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">License Expiry Date</label>
                        <input type="date" name="license_expiry_date" class="form-control" value="{{ driver.license_expiry_date.strftime('%Y-%m-%d') if driver and driver.license_expiry_date else '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" {% if driver and driver.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if driver and driver.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            <option value="Suspended" {% if driver and driver.status == 'Suspended' %}selected{% endif %}>Suspended</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control" value="{{ driver.date_of_birth.strftime('%Y-%m-%d') if driver and driver.date_of_birth else '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" rows="2" class="form-control">{{ driver.address if driver else '' }}</textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Password {% if action == 'Edit' %}<small class="text-muted">(Leave blank to keep current)</small>{% else %}<span class="text-danger">*</span>{% endif %}</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" {% if action == 'Add' %}required{% endif %}>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary">
                    <a href="{{ url_for('admin.drivers') }}" class="btn btn-outline-custom">
                        <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="fa-solid fa-check me-2"></i> Save Driver Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
